name: Docker Image Pusher

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # 只在这两个文件变动时才触发，避免改 README 等也去吃一遍 runner
    paths:
      - 'images.txt'
      - '.github/workflows/docker.yaml'
  # 需要定时同步时取消下面两行注释（cron 用 UTC，'0 0 * * *' = 北京时间每天 08:00）
  # schedule:
  #   - cron: '0 0 * * *'

# 同一时间只允许一个任务，避免并发挤爆磁盘
concurrency:
  group: docker-image-pusher
  cancel-in-progress: false

# 最小权限：本流程只需要读代码
permissions:
  contents: read

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull and Push
    # 钉死 24.04：ubuntu-latest 将于 2026-10-19 起迁移到 26.04
    # （actions/runner-images#14748），跟着 latest 漂移容易某天突然构建失败
    runs-on: ubuntu-24.04
    # 防止卡在 ACR 上传时挂满 6 小时默认上限
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 归一化 images.txt：干掉 Windows CRLF 和行尾空白。
      # 不加这一步，CRLF 会让 docker pull 直接报 invalid reference format。
      - name: Normalize images.txt
        run: |
          if command -v file >/dev/null && file images.txt | grep -q CRLF; then
            echo "::warning::检测到 images.txt 是 CRLF 换行，已自动转换（建议本地也改成 LF）"
          fi
          sed -i 's/\r$//' images.txt               # 去掉 Windows 回车
          sed -i 's/[[:space:]]*$//' images.txt     # 去掉行尾空白
          sed -i 's/[[:space:]]*#.*$//' images.txt  # 去掉行内注释（镜像名不含 #）
          echo "===== images.txt 预览（行尾 \$ = LF，^M\$ = CRLF）====="
          cat -A images.txt
          echo "=================================================="

      # 可选：登录 Docker Hub，把匿名 100 次/6h 提到认证 200 次/6h。
      # 不配 DOCKERHUB_USERNAME/TOKEN 时会自动跳过。
      - name: Login to Docker Hub (optional)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            echo "Docker Hub 已登录（限流额度 100/6h → 200/6h）"
          else
            echo "未配置 DOCKERHUB_USERNAME/TOKEN，跳过登录（匿名拉取，可能撞 429）"
          fi

      - name: Build and push image to Aliyun
        run: |
          set -euo pipefail

          echo "===== 登录阿里云 ACR ====="
          echo "$ALIYUN_REGISTRY_PASSWORD" | \
            docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

          echo "===== 第一轮：统计重名镜像 ====="
          declare -A duplicate_images
          declare -A temp_map
          while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              [[ "$line" =~ ^[[:space:]]*# ]] && continue

              image=$(echo "$line" | awk '{print $NF}')
              image="${image%%@*}"
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
              name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
              name_space="${name_space}_"
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

              if [ -n "${temp_map[$image_name]:-}" ]; then
                  if [ "${temp_map[$image_name]}" != "$name_space" ]; then
                      echo "  发现重名镜像: $image_name"
                      duplicate_images[$image_name]="true"
                  fi
              else
                  temp_map[$image_name]="$name_space"
              fi
          done < images.txt

          echo "===== 第二轮：拉取并推送 ====="
          fail_count=0
          total=0

          while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              [[ "$line" =~ ^[[:space:]]*# ]] && continue

              total=$((total+1))
              echo "::group::[$total] $line"

              # 刻意不加引号：$line 可能是 "--platform=linux/arm64 xiaoyaliu/alist"
              # 这种带参数形式，需要 shell 做词分割。CRLF 已在前面清掉。
              if ! docker pull $line; then
                  echo "::error::拉取失败，跳过: $line"
                  fail_count=$((fail_count+1))
                  echo "::endgroup::"
                  continue
              fi

              platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
              if [ -z "$platform" ]; then
                  platform_prefix=""
              else
                  platform_prefix="${platform//\//_}_"
              fi

              image=$(echo "$line" | awk '{print $NF}')
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
              name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

              name_space_prefix=""
              if [ -n "${duplicate_images[$image_name]:-}" ] && [ -n "$name_space" ]; then
                  name_space_prefix="${name_space}_"
              fi

              image_name_tag="${image_name_tag%%@*}"
              new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

              docker tag "$image" "$new_image"

              if ! docker push "$new_image"; then
                  echo "::error::推送失败: $new_image"
                  fail_count=$((fail_count+1))
              fi

              # 清理，失败也不中断
              docker rmi "$image"     || true
              docker rmi "$new_image" || true

              df -hT | tail -1 || true
              echo "::endgroup::"
          done < images.txt

          echo "===== 汇总：共 $total 个镜像，失败 $fail_count 个 ====="
          [ "$fail_count" -eq 0 ] || exit 1
